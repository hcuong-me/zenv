name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release build
        run: |
          mkdir -p dist
          swift build -c release
          cp -f .build/release/zenv dist/zenv
      - uses: actions/upload-artifact@v4
        with:
          name: zenv-macos
          path: dist/zenv

  lint-arch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Layer rules
        run: bash scripts/lint-deps.sh
